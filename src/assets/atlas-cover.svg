    <rect x="188" y="616" width="22" height="64" fill="#DDD6FE"/><rect x="210" y="616" width="22" height="64" fill="#C4B5FD"/>
    <rect x="232" y="616" width="22" height="64" fill="#A78BFA"/><rect x="254" y="616" width="22" height="64" fill="#8B5CF6"/>
    <rect x="276" y="616" width="22" height="64" fill="#7C3AED"/><rect x="298" y="616" width="22" height="64" fill="#6D28D9"/>
    <rect x="320" y="616" width="22" height="64" fill="#5B21B6"/><rect x="342" y="616" width="24" height="64" fill="#4C1D95"/>
